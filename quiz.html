<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>

<div class="quiz-container">

    <h1 style="color: blue;">Quiz App</h1><br>

    

    <!-- Question -->
    <h2 id="question">Question here</h2>

    <!-- Options -->
    <div class="options">
        <button class="btn" id="opt0" onclick="checkAnswer(0)"></button>
        <button class="btn" id="opt1" onclick="checkAnswer(1)"></button>
        <button class="btn" id="opt2" onclick="checkAnswer(2)"></button>
        <button class="btn" id="opt3" onclick="checkAnswer(3)"></button>
    </div>

    <!-- Next Button -->
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

</div>

<script src="quiz.js"></script>

</body>
</html>
