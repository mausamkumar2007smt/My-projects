<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_page</title>
</head>
<body>
    <div class="form-container">
        <div id="form">
            Username : <input type="text" id="ur"><br><br>
            Password : <input type="password" id="pass"><br><br>
            <button onclick="chklogin()"id="login">Login</button>

        </div>
    </div>
    <style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    }

    .form-container {
        background: #fff;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        text-align: center;
    }

    input {
        width: 90%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        width: 95%;
        padding: 10px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background: #45a049;
    }
    </style>

    <script>
        function chklogin(){
            let user = document.getElementById("ur").value;
            let pas = document.getElementById("pass").value;
            if(user=="" && pas==""){
                alert("Please Enter username and password")
            }else if(user=="Mausam@2008" && pas=="123!@#"){
                alert("Login Successfull.")
                alert("---Loading Digital Clock---")
                window.location.href="clock.html";
                
            }else{
                alert("Password not matched.")
            } 
        }
    </script>
</body>
</html>
